<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prize Giving Ceremony</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 20px auto;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }
        .card h3 {
            margin: 10px 0 0 0;
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Prize Giving Ceremony</h1>

    <div class="gallery">
        <!-- Pic 1 -->
        <div class="card">
            <img src="pic1.jpg" alt="Pic 1">
            <h3>Ceremony Start</h3>
        </div>
        <!-- Pic 2 -->
        <div class="card">
            <img src="pic2.jpg" alt="Pic 2">
            <h3>Guest Speech</h3>
        </div>
        <!-- Pic 3 -->
        <div class="card">
            <img src="pic3.jpg" alt="Pic 3">
            <h3>First Prize</h3>
        </div>
        <!-- Pic 4 -->
        <div class="card">
            <img src="pic4.jpg" alt="Pic 4">
            <h3>Second Prize</h3>
        </div>
        <!-- Pic 5 -->
        <div class="card">
            <img src="pic5.jpg" alt="Pic 5">
            <h3>Third Prize</h3>
        </div>
        <!-- Pic 6 -->
        <div class="card">
            <img src="pic6.jpg" alt="Pic 6">
            <h3>Special Award</h3>
        </div>
        <!-- Pic 7 -->
        <div class="card">
            <img src="pic7.jpg" alt="Pic 7">
            <h3>Group Photo</h3>
        </div>
        <!-- Pic 8 (Result) -->
        <div class="card">
            <img src="result.jpg" alt="Result">
            <h3>Result</h3>
        </div>
    </div>

</body>
</html>
